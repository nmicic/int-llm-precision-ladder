[platformio]
default_envs = mkrzero_dual

[env]
platform = atmelsam @ 8.3.0
board = mkrzero
framework = arduino
monitor_speed = 115200
build_flags =
    -O2
    -fwrapv
    -I../../mcu-f12-microgpt/harness/include
    -Wno-unused-function
    -Wno-unused-variable
    -DFP_MATH_FORCE_PORTABLE
    -DMGPT_NO_TRAIN
    -DMGPT_NO_MAIN
    -DMGPT_PACKED_F12
    -DMGPT_OBSERVE_LOGITS
    -DMGPT_MKRZERO=1

[env:mkrzero_dual]
build_flags =
    ${env.build_flags}
    -DMGPT_FULL_DUAL=1
    -DMGPT_INCLUDE_WIDE=1
    -DMGPT_INCLUDE_PACKED=1
    -DMGPT_INCLUDE_CORRUPT=1

[env:mkrzero_wide]
build_flags =
    ${env.build_flags}
    -DMGPT_FULL_WIDE_ONLY=1
    -DMGPT_INCLUDE_WIDE=1
    -DMGPT_INCLUDE_PACKED=0
    -DMGPT_INCLUDE_CORRUPT=0

[env:mkrzero_packed]
build_flags =
    ${env.build_flags}
    -DMGPT_FULL_PACKED_ONLY=1
    -DMGPT_INCLUDE_WIDE=0
    -DMGPT_INCLUDE_PACKED=1
    -DMGPT_INCLUDE_CORRUPT=0
